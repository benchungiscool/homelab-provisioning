#cloud-config

disable_root: true

users:
  - name: ben
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - "ssh-rsa  ben@benchung.dev"

ssh_pwauth: false

packages:
  - python3
  - sudo
  - qemu-guest-agent

runcmd:
  - rm -f /etc/ssh/ssh_host_*
  - ssh-keygen -A
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart ssh
  - systemctl enable --now qemu-guest-agent
