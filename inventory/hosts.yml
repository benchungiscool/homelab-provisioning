all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
  hosts:
    localhost:
      ansible_connection: local

  children:
    proxmox:
      vars:
        ansible_user: root
      hosts:
        pve:
          ansible_host: 192.168.100.1

    vms:
      vars:
        ansible_user: ben
        ansible_become_password: "{{ vault_ben_password }}"
      hosts:
        new_vm:
          ansible_host: 192.168.100.7  # override with -e ansible_host=<ip> for targeted runs
