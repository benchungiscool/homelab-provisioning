---
- name: Reconcile VMs on Proxmox
  hosts: pve
  gather_facts: false

  tasks:
    - name: Create reconcile working directory
      ansible.builtin.file:
        path: /tmp/homelab-reconcile
        state: directory
        mode: "0755"
      check_mode: false

    - name: Upload reconcile script and config
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: scripts/reconcile-vms.py, dest: /tmp/homelab-reconcile/reconcile-vms.py }
        - { src: config/vms.yml, dest: /tmp/homelab-reconcile/vms.yml }
      check_mode: false

    - name: Reconcile VMs
      ansible.builtin.command: >
        python3 /tmp/homelab-reconcile/reconcile-vms.py /tmp/homelab-reconcile/vms.yml
        {{ '--dry-run' if ansible_check_mode else '' }}
      register: reconcile_output
      changed_when: "'Creating' in reconcile_output.stdout or 'Updated' in reconcile_output.stdout or 'Destroying' in reconcile_output.stdout"

    - name: Reconcile output
      ansible.builtin.debug:
        msg: "{{ reconcile_output.stdout_lines }}"

    - name: List managed VMs
      ansible.builtin.command: python3 /tmp/homelab-reconcile/reconcile-vms.py /tmp/homelab-reconcile/vms.yml --list-managed
      register: managed_vms_raw
      changed_when: false
      check_mode: false

    - name: Register managed VMs for bootstrapping
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: managed_vms
        ansible_host: "{{ item.ip }}"
        ansible_user: ben
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
        ansible_become_password: "{{ vault_ben_password }}"
      loop: "{{ managed_vms_raw.stdout | from_json }}"
      when: item.ip is not none
      changed_when: false
      check_mode: false

- name: Bootstrap managed VMs
  hosts: managed_vms
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather facts
      ansible.builtin.setup:

    - name: Run bootstrap tasks
      ansible.builtin.import_tasks: tasks/bootstrap.yml

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
